# Family Dashboard - Backend Runtime Config
#
# Secrets do NOT belong here. JWT_SECRET, WEATHER_LAT, WEATHER_LON and
# WEATHER_TZ are read from the environment (.env / docker-compose) and override
# anything set below.

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "15s"
  write_timeout: "60s"
  # Cookies are only marked Secure when the dashboard is served over HTTPS.
  secure_cookies: false
  # Extra browser origins allowed to call the API. Empty in production, where
  # frontend and backend share one origin behind Traefik.
  allowed_origins: []

database:
  path: "/app/data/db.sqlite"
  backup_dir: "/app/data/backup"
  backup_retention_days: 7
  backup_cron: "0 3 * * *"

auth:
  # jwt_secret comes from the JWT_SECRET environment variable.
  token_ttl: "168h"   # 7 days — a family tablet should not log itself out daily

weather:
  latitude: 48.2082
  longitude: 16.3738
  timezone: "Europe/Vienna"
  cache_ttl: "10m"

calendar:
  ics_dir: "/app/data/ics"
  watch: true
  lookahead_days: 60

notes:
  dir: "/app/data/notes"
  watch: true

photos:
  dir: "/app/data/photos"

# Dateien zum Herunterladen. Hochladen darf nur ein Administrator, herunterladen
# jeder — auch das Wandgerät, denn das sind Familiendateien.
files:
  dir: "/app/data/files"

# Musik. Der Ordner wird in docker-compose.yml schreibgeschützt eingehängt;
# WO er auf dem Rechner liegt, steht in der .env unter MUSIC_HOST_DIR.
#
# Der Pfad hier ist der Pfad INNERHALB des Containers. Ein leerer Wert schaltet
# das Modul ganz ab. Überschreibbar über die Umgebungsvariable MUSIC_DIR.
music:
  dir: "/app/audio"

devices:
  check_interval: "30s"
  timeout: "5s"
  # Diese Liste wird NUR beim allerersten Start in die Datenbank übernommen.
  # Danach werden Geräte im Dashboard unter Verwaltung -> Geräte gepflegt.
  #
  #   url  = Adresse, die der Health-Check abfragt (oft ein API-Pfad)
  #   link = Oberfläche, die sich beim Antippen der Kachel öffnet
  #
  # Die Beispiele unten stehen bewusst auf "enabled: false". Sie zeigen auf
  # 192.168.1.20 — eine Adresse aus der Vorlage, die es bei dir sehr
  # wahrscheinlich nicht gibt. Aktiv ausgeliefert begrüsst eine frische
  # Installation ihren Besitzer mit drei roten Kacheln.
  #
  # Also: eigene Adressen eintragen, "enabled" auf true setzen — oder die
  # Beispiele löschen und die Geräte im Adminbereich anlegen. Fehlt das Feld
  # ganz, gilt ein Gerät als aktiv.
  targets:
    - name: "Plex"
      type: "http"
      url: "http://192.168.1.20:32400/identity"
      link: "http://192.168.1.20:32400/web"
      expect_status: 200
      enabled: false
    - name: "Kavita"
      type: "http"
      url: "http://192.168.1.20:5000/api/health"
      link: "http://192.168.1.20:5000"
      enabled: false
    - name: "FileBrowser"
      type: "http"
      url: "http://192.168.1.20:8080/health"
      link: "http://192.168.1.20:8080"
      enabled: false
