name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Ziel: Was hier grün ist, lässt sich auch zu Hause bauen und starten.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend bauen und prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Kompilieren
        working-directory: backend
        run: go build ./...

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Tests
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend typprüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typprüfung
        working-directory: frontend
        run: npm run check

      - name: Produktions-Build
        working-directory: frontend
        run: npm run build

  skripte:
    name: Shell-Skripte prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

  container:
    name: Container bauen und starten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Zuerst die .env, sonst kann Compose ${JWT_SECRET} nicht auflösen
      # und bricht schon beim Einlesen der Datei ab.
      - name: .env erzeugen
        run: make setup

      - name: Compose-Datei prüfen
        run: docker compose config -q

      - name: Images bauen
        run: docker compose build

      # Der eigentliche Beweis: Der Stack startet und antwortet.
      - name: Stack starten
        run: docker compose up -d --wait

      - name: Rauchtest
        run: make verify

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose logs --tail=100

      - name: Aufräumen
        if: always()
        run: docker compose down -v
