server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is only reachable inside the LAN; these are belt-and-braces.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hochgeladen wird durch diesen Proxy hindurch. Der Wert muss zur Grenze
    # im Backend passen: Fotos 120 MB je Vorgang, Familiendateien 300 MB.
    # Steht hier weniger, weist nginx den Upload ab, bevor das Backend seine
    # verständliche Fehlermeldung schicken kann.
    client_max_body_size 320m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # WebSocket first: a prefix location must not be shadowed by /api/.
    location = /api/shopping/ws {
        proxy_pass http://family-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host keeps the port; $host would drop it and break the
        # backend's same-origin check on the WebSocket handshake.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The Go API keeps its /api prefix — nothing is stripped here.
    location /api/ {
        proxy_pass http://family-backend:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port; $host would drop it and break the
        # backend's same-origin check on the WebSocket handshake.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Hashed build assets can be cached forever.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and manifest must never be served stale, otherwise a
    # tablet keeps running last week's app.
    #
    # add_header in einem location ersetzt die Köpfe von server-Ebene, statt sie
    # zu ergänzen — deshalb stehen die drei Sicherheitsköpfe hier jedes Mal
    # noch einmal.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Die Seite selbst (index.html) trägt die Namen der Dateien mit Hash. Ohne
    # Cache-Control darf ein Browser sie nach eigenem Ermessen eine Weile
    # behalten — und ruft nach einem Update Dateien ab, die es nicht mehr
    # gibt. Heraus kommt eine weisse Seite, die sich erst mit „Cache leeren"
    # wieder erholt. "no-cache" heisst: jedes Mal nachfragen, aber bei
    # unverändertem Stand nur ein kurzes „304".
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Icons und Schriften ändern sich praktisch nie.
    location ~ ^/(icons|fonts)/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Alles andere ist die App: jede Adresse (/rangliste, /belohnungen …)
    # liefert dieselbe index.html aus.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
